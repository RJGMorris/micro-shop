# Opens pull requests for outdated dependencies. CI then tests each update.
# Grouping produces one pull request per type each week instead of dozens.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Major versions are often tied to a newer .NET, so upgrade those on purpose.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /src/Catalog.Api
      - /src/Orders.Api
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
